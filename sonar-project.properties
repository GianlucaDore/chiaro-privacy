# Configurazione dell'analisi di SonarQube Cloud.
#
# Lo legge lo scanner che gira nella pipeline, al job `sonar` di
# .github/workflows/ci.yml. Sta nella radice perche' il repository contiene due
# progetti, e Sonar li analizza insieme come uno solo.

# --- Chi siamo su SonarQube Cloud --------------------------------------------
# Le due chiavi si leggono nella pagina del progetto su SonarQube Cloud, sotto
# Information. Sono identificativi, non segreti: il segreto e' il token, che sta
# nei Secrets di GitHub e non in questo file.
sonar.organization=gianlucadore
sonar.projectKey=GianlucaDore_chiaro-privacy
sonar.projectName=chiaro-privacy

# --- Cosa analizzare ---------------------------------------------------------
# Solo il codice dell'applicazione e i suoi test. Configurazioni, Dockerfile e
# documentazione restano fuori: non sono codice su cui Sonar abbia regole utili.
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/tests
sonar.python.version=3.12

# --- Copertura: esclusa finche' non viene importata --------------------------
# La Quality Gate di default pretende l'80% di copertura sul codice nuovo, appena
# una modifica supera le 20 righe. Sonar pero' la copertura non la calcola: la
# legge da un rapporto prodotto dai test, e quel rapporto arriva al passo 1.9
# per il backend e al 4.9 per il frontend. Fino ad allora ogni modifica vera
# avrebbe la gate rossa per un numero che nessuno sta ancora misurando.
#
# Escludere tutto dalla copertura la rende "non calcolata", e la condizione non
# viene valutata. Le altre condizioni - bug, vulnerabilita', manutenibilita',
# duplicazioni, security hotspot - restano attive.
#
# ❗ Da restringere al passo 1.9 (via backend/) e da togliere al 4.9.
sonar.coverage.exclusions=**/*

# --- La Quality Gate blocca il job -------------------------------------------
# Lo scanner aspetta il verdetto della gate e, se e' rossa, fa fallire il job.
# Senza, l'analisi verrebbe solo inviata e il job resterebbe verde comunque.
sonar.qualitygate.wait=true
