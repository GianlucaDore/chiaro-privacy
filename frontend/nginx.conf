# =============================================================================
# Configurazione di nginx per servire il frontend costruito.
#
# Va copiato dentro l'immagine in /etc/nginx/conf.d/default.conf, che e' il
# file che l'immagine ufficiale di nginx carica per il sito di default: cosi'
# si sostituisce quella predefinita senza toccare il resto di nginx.conf.
#
# `listen 80` e' la porta DENTRO il container. Cambierebbe solo passando
# all'immagine nginx-unprivileged, che ascolta sulla 8080.
# =============================================================================

server {
    listen 80;
    server_name _;

    # La cartella da cui nginx serve i file. E' la destinazione del
    # COPY --from nel Dockerfile.
    root /usr/share/nginx/html;
    index index.html;

    # Non annunciare la versione di nginx negli header e nelle pagine di
    # errore: e' informazione regalata a chi cerca una versione vulnerabile.
    server_tokens off;

    # --- Il cuore del file: il fallback della single-page application -------
    #
    # `try_files` prova le alternative in ordine e serve la prima che esiste.
    # Qui: prova il file richiesto, poi la cartella richiesta, e se nessuno
    # dei due esiste servi index.html.
    #
    # Senza questa riga, premere F5 su una rotta interna dell'app da 404:
    # quella rotta esiste solo nel router di React, che gira nel browser, e
    # sul disco non c'e' nessun file con quel nome. Servendo index.html,
    # React riparte e il router riconosce l'URL.
    #
    # ⚠️ Non e' un trucco per nascondere i 404: qualunque percorso inesistente
    # risponde ora 200 con l'app dentro. E' il comportamento voluto per una
    # SPA - la pagina "non trovato" la disegna l'applicazione, non il server.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Cache ---------------------------------------------------------------
    #
    # Vite mette un'impronta del contenuto nel nome dei file che produce
    # (index-CU2MdaLe.js): se il contenuto cambia, cambia il nome. Un file con
    # il nome che cambia insieme al contenuto puo' essere messo in cache per
    # sempre, perche' non verra' mai richiesto con lo stesso nome e contenuto
    # diverso.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html invece NON va messo in cache: e' il file che contiene i
    # riferimenti ai nomi con l'impronta. Se il browser ne tiene una copia
    # vecchia, continua a chiedere il JavaScript della versione precedente e
    # il rilascio non arriva mai all'utente.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # --- Compressione --------------------------------------------------------
    # Il bundle passa da 367 kB a circa 119 kB.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
